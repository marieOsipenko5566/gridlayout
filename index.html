<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Untitled Document</title>
    <style type="text/css">
        header{height:150px; background-color:#E8C5C6;}
        footer{height:150px; background-color:#E8C5C6;}
        #container{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grip-gap:10px;
            mid-height:250px;
            height:100vh;
        }
        #mainContent{
            background-color:#ABD;
            grid-column:1/span 3;
            grid-row:1/span 2;
        }
        #secondaryContent{
            background-color:#BCA;
            grid-column:4/span 2;
            grid-row:1/span 4;
        }
        #sidebar{
            background-color:#DCA;
            grid-column:1/ span 1;
            grid-row:3/ span 2;
        }
    </style>
</head>

<body>
    <header>logo nav</header>
    <div id="container">
    <div id="mainContent">main content</div>
    <div id="secondaryContent">secondary content</div>
    <div id="sidebar">sidebar</div>
    </div>
    <footer>footer</footer>
</body>
</html>
